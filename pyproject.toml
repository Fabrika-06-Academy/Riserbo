[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "riserbo"
version = "0.13.4"
description = "Pseudonimizzare testi italiani prima di mandarli a un modello in cloud, e rimettere i valori veri al ritorno."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrea Prando", email = "andrea@fabrika06.com" }]
requires-python = ">=3.10"
keywords = ["gdpr", "pseudonimizzazione", "pii", "privacy", "italiano", "presidio", "llm"]
classifiers = [
  "Natural Language :: Italian",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = ["presidio-analyzer>=2.2.360", "phonenumbers>=8.13", "onnxruntime>=1.18", "tokenizers>=0.15", "numpy", "certifi"]

[project.optional-dependencies]
# Leggere e scrivere Word, PDF ed Excel (l'app li usa; il servizio da riga di comando no).
documenti = ["python-docx>=1.1", "pypdfium2>=4.30", "openpyxl>=3.1", "olefile>=0.46", "Pillow>=10.1"]
# Scansioni e foto: modelli PP-OCRv6 di PaddleOCR con ONNX Runtime (RapidOCR). Inclusi nel pacchetto, niente download.
ocr = ["riserbo[documenti]", "rapidocr>=3.4", "onnxruntime>=1.18"]
# La finestra nativa dell'app (WebKit su Mac, WebView2 su Windows). Senza, l'app si apre nel browser.
app = ["riserbo[documenti,ocr]", "pywebview>=5.3"]
test = ["pytest>=8", "riserbo[documenti,ocr]"]

[project.scripts]
riserbo = "riserbo.cli:main"
segnaposto = "riserbo.cli:main"  # il vecchio nome del comando, per chi lo usa già

[project.urls]
Homepage = "https://github.com/Fabrika-06-Academy/riserbo"
Lezione = "https://academy.fabrika06.com/corso/dati-protetti-dati-dal-web/"

[tool.hatch.build.targets.wheel]
packages = ["src/riserbo"]
