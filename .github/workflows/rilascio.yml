# Costruisce l'app per Mac (Apple Silicon) e Windows quando si pubblica un tag vX.Y.Z, e la allega alla release.
name: rilascio
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            nome: riserbo-mac-apple-silicon.zip
          - os: windows-latest
            nome: riserbo-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[test,app]" pyinstaller pillow pytest-github-actions-annotate-failures
      - run: pytest -q
      - name: Riconoscitore di entità dentro l'app (niente download al primo avvio)
        shell: bash
        run: |
          python -c "from riserbo.ner import scarica_modello; import shutil; shutil.copytree(scarica_modello(), 'src/riserbo/modello', dirs_exist_ok=True)"
          ls -la src/riserbo/modello
      - run: pyinstaller --noconfirm --clean riserbo.spec
        working-directory: packaging
      - name: Prova del pacchetto (modello, documenti, finestra)
        shell: bash
        env:
          SEGNAPOSTO_PROVA: "1"
          SEGNAPOSTO_PROVA_ESITO: ${{ github.workspace }}/esito-prova.txt
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then packaging/dist/Riserbo.app/Contents/MacOS/riserbo; else packaging/dist/riserbo/riserbo.exe; fi
          cat esito-prova.txt
          grep -q "pacchetto completo" esito-prova.txt
      - name: Prova del server MCP (come lo avvia Claude Desktop)
        shell: bash
        run: |
          mkdir -p prova-mcp && printf 'Contratto di Mario Rossi, CF RSSMRA80A01L840J.\n' > prova-mcp/contratto.txt
          if [ "$RUNNER_OS" = "macOS" ]; then BIN=packaging/dist/Riserbo.app/Contents/MacOS/riserbo; DIR="$PWD/prova-mcp"
          else BIN=packaging/dist/riserbo/riserbo-mcp.exe; DIR="$(pwd -W)/prova-mcp"; fi
          printf '%s\n' '{"jsonrpc":"2.0","id":0,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"leggi_documento","arguments":{"documento":"contratto.txt"}}}' \
            | "$BIN" mcp --cartella "$DIR" > risposta-mcp.txt
          cat risposta-mcp.txt
          grep -q "CODICE_FISCALE_1" risposta-mcp.txt
          ! grep -q "RSSMRA80A01L840J" risposta-mcp.txt
      - name: Pacchetto Mac (zip e dmg)
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --keepParent packaging/dist/Riserbo.app "${{ matrix.nome }}"
          mkdir -p dmg && cp -R packaging/dist/Riserbo.app dmg/ && ln -s /Applications dmg/Applicazioni
          hdiutil create -volname "Riserbo" -srcfolder dmg -ov -format UDZO riserbo-mac-apple-silicon.dmg
      - name: Estensione del browser (zip)
        if: runner.os == 'macOS'
        run: |
          python -c "import json; m=json.load(open('estensione/manifest.json')); assert m['version']=='${GITHUB_REF_NAME#v}', m['version']" || [ "${GITHUB_REF_TYPE}" != "tag" ]
          cd estensione && zip -r ../riserbo-estensione.zip . -x ".*"
      - name: Pacchetto Windows
        if: runner.os == 'Windows'
        run: Compress-Archive -Path packaging/dist/riserbo -DestinationPath "${{ matrix.nome }}"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: false
          files: |
            ${{ matrix.nome }}
            riserbo-mac-apple-silicon.dmg
            riserbo-estensione.zip
