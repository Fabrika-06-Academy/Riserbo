# Costruisce l'app per Mac (Apple Silicon) e Windows quando si pubblica un tag vX.Y.Z, e la allega alla release.
name: rilascio
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            nome: segnaposto-mac-apple-silicon.zip
          - os: windows-latest
            nome: segnaposto-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[test,app]" pyinstaller pillow pytest-github-actions-annotate-failures
      - run: pip install https://github.com/explosion/spacy-models/releases/download/it_core_news_sm-3.8.0/it_core_news_sm-3.8.0-py3-none-any.whl
      - run: pytest -q
      - run: pyinstaller --noconfirm --clean segnaposto.spec
        working-directory: packaging
      - name: Prova del pacchetto (modello, documenti, finestra)
        shell: bash
        env:
          SEGNAPOSTO_PROVA: "1"
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then packaging/dist/segnaposto.app/Contents/MacOS/segnaposto; else packaging/dist/segnaposto/segnaposto.exe; fi
      - name: Pacchetto Mac (zip e dmg)
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --keepParent packaging/dist/segnaposto.app "${{ matrix.nome }}"
          mkdir -p dmg && cp -R packaging/dist/segnaposto.app dmg/ && ln -s /Applications dmg/Applicazioni
          hdiutil create -volname "segnaposto" -srcfolder dmg -ov -format UDZO segnaposto-mac-apple-silicon.dmg
      - name: Pacchetto Windows
        if: runner.os == 'Windows'
        run: Compress-Archive -Path packaging/dist/segnaposto -DestinationPath "${{ matrix.nome }}"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: false
          files: |
            ${{ matrix.nome }}
            segnaposto-mac-apple-silicon.dmg
