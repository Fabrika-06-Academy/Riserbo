[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "segnaposto"
version = "0.2.0"
description = "Pseudonimizzare testi italiani prima di mandarli a un modello in cloud, e rimettere i valori veri al ritorno."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrea Prando", email = "andrea@fabrika06.com" }]
requires-python = ">=3.10"
keywords = ["gdpr", "pseudonimizzazione", "pii", "privacy", "italiano", "presidio", "llm"]
classifiers = [
  "Natural Language :: Italian",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = ["presidio-analyzer>=2.2.360", "phonenumbers>=8.13"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
segnaposto = "segnaposto.cli:main"

[project.urls]
Homepage = "https://github.com/Fabrika-06-Academy/segnaposto"
Lezione = "https://academy.fabrika06.com/corso/dati-protetti-dati-dal-web/"

[tool.hatch.build.targets.wheel]
packages = ["src/segnaposto"]
